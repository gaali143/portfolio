<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2D Face</title>
  <style>
    html, body{
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
    }

    /* Container fits whatever size the iframe gets */
    .face-wrap{
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }

    /* Main head */
    .head{
      width: 85%;
      aspect-ratio: 1 / 1;
      max-width: 220px;
      border-radius: 50%;
      position: relative;

      /* soft skin tone */
      background: radial-gradient(circle at 35% 30%, #ffe2c6, #f5b88f 70%);
      box-shadow: 0 18px 30px rgba(0,0,0,0.15);

      display: grid;
      place-items: center;
    }

    /* Hair */
    .hair{
      position: absolute;
      top: -6%;
      left: 10%;
      width: 80%;
      height: 45%;
      border-radius: 50% 50% 40% 40%;
      background: radial-gradient(circle at 40% 30%, #2b1b14, #0f0a08 75%);
      z-index: 2;
    }

    /* Ears */
    .ear{
      position: absolute;
      top: 42%;
      width: 14%;
      height: 18%;
      border-radius: 50%;
      background: #f2b08a;
      z-index: 0;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.05);
    }
    .ear.left{ left: -6%; }
    .ear.right{ right: -6%; }

    /* Eyes group */
    .eyes{
      position: absolute;
      top: 43%;
      width: 72%;
      display: flex;
      justify-content: space-between;
      z-index: 3;
    }

    .eye{
      width: 22%;
      height: 18%;
      background: #fff;
      border-radius: 50%;
      position: relative;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08);
    }

    .pupil{
      position: absolute;
      top: 28%;
      left: 34%;
      width: 32%;
      height: 44%;
      border-radius: 50%;
      background: #1a2b3a;
    }

    .shine{
      position: absolute;
      top: 18%;
      left: 20%;
      width: 18%;
      height: 22%;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
    }

    /* Eyebrows */
    .brows{
      position: absolute;
      top: 34%;
      width: 74%;
      display: flex;
      justify-content: space-between;
      z-index: 4;
    }
    .brow{
      width: 24%;
      height: 10%;
      border-radius: 999px;
      background: #1b120e;
      opacity: 0.85;
      transform: rotate(-6deg);
    }
    .brow.right{
      transform: rotate(6deg);
    }

    /* Nose */
    .nose{
      position: absolute;
      top: 55%;
      left: 50%;
      width: 10%;
      height: 14%;
      transform: translateX(-50%);
      border-radius: 0 0 999px 999px;
      background: rgba(0,0,0,0.08);
      z-index: 3;
      filter: blur(0.2px);
    }

    /* Mouth */
    .mouth{
      position: absolute;
      top: 70%;
      left: 50%;
      width: 28%;
      height: 14%;
      transform: translateX(-50%);
      border-bottom: 6px solid rgba(120, 30, 40, 0.55);
      border-radius: 0 0 999px 999px;
      z-index: 3;
    }

    /* Cheeks */
    .cheek{
      position: absolute;
      top: 62%;
      width: 18%;
      height: 14%;
      border-radius: 50%;
      background: rgba(255, 105, 135, 0.22);
      filter: blur(0.2px);
      z-index: 1;
    }
    .cheek.left{ left: 18%; }
    .cheek.right{ right: 18%; }

    /* Small friendly hover animation */
    .head{
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .head:hover{
      transform: translateY(-4px);
      box-shadow: 0 22px 35px rgba(0,0,0,0.18);
    }
  </style>
</head>
<body>
  <div class="face-wrap">
    <div class="head">
      <div class="hair"></div>

      <div class="ear left"></div>
      <div class="ear right"></div>

      <div class="brows">
        <div class="brow left"></div>
        <div class="brow right"></div>
      </div>

      <div class="eyes">
        <div class="eye">
          <div class="pupil"><div class="shine"></div></div>
        </div>
        <div class="eye">
          <div class="pupil"><div class="shine"></div></div>
        </div>
      </div>

      <div class="nose"></div>

      <div class="cheek left"></div>
      <div class="cheek right"></div>

      <div class="mouth"></div>
    </div>
  </div>
</body>
</html>
